apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-document-site
  labels:
    app.kubernetes.io/name: sample-document-site
    app.kubernetes.io/component: docs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-document-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-document-site
        app.kubernetes.io/component: docs
    spec:
      containers:
        - name: blume
          image: ghcr.io/jlandowner/sample-document-site:v0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4321
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "4321"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-document-site
  labels:
    app.kubernetes.io/name: sample-document-site
    app.kubernetes.io/component: docs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sample-document-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-document-site
  labels:
    app.kubernetes.io/name: sample-document-site
    app.kubernetes.io/component: docs
spec:
  ingressClassName: internal
  rules:
    - host: docs.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-document-site
                port:
                  name: http
